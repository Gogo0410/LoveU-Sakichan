<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1d23">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>宅建600 - らっきょ&さき</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #f5f1ea; --bg-card: #ffffff; --ink: #1a1d23; --ink-soft: #5c5f66;
    --ink-faint: #a0a4ab; --accent: #c8463a; --accent-soft: #e8c5c0;
    --sub: #4a6741; --line: #e5dfd4;
    --warn-bg: #fef3c7; --warn-text: #92400e;
    --shadow: 0 1px 3px rgba(26, 29, 35, 0.04), 0 2px 8px rgba(26, 29, 35, 0.04);
  }
  body {
    font-family: 'Noto Serif JP', serif; background: var(--bg); color: var(--ink);
    line-height: 1.5; min-height: 100vh; padding-bottom: 80px;
    background-image: radial-gradient(circle at 20% 10%, rgba(200, 70, 58, 0.03) 0%, transparent 40%);
  }
  .container { max-width: 480px; margin: 0 auto; padding: 20px 18px; }

  /* Mode Select */
  .mode-select { min-height: 80vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
  .mode-brand { font-size: 28px; font-weight: 700; margin-bottom: 30px; }
  .mode-brand .num { font-family: 'JetBrains Mono', monospace; color: var(--accent); }
  .mode-btn { width: 280px; padding: 20px; background: var(--bg-card); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 12px; cursor: pointer; transition: all 0.2s; box-shadow: var(--shadow); }
  .mode-btn.rakkyo { background: var(--ink); color: var(--bg); }
  .mode-btn.saki { background: linear-gradient(135deg, #e8c5c0, #f5d4cf); border-color: transparent; }

  header { text-align: center; padding: 12px 0 20px; border-bottom: 1px solid var(--line); margin-bottom: 20px; position: relative; }
  .role-badge { position: absolute; top: 0; right: 0; font-size: 10px; padding: 4px 10px; border-radius: 12px; background: var(--ink); color: var(--bg); }
  .role-badge.saki { background: var(--accent); }
  .switch-btn { position: absolute; top: 0; left: 0; font-size: 11px; background: transparent; border: 1px solid var(--line); padding: 4px 10px; border-radius: 12px; color: var(--ink-soft); cursor: pointer; }
  .brand { font-size: 24px; font-weight: 700; }
  .brand .num { font-family: 'JetBrains Mono', monospace; color: var(--accent); }

  .tabs { display: flex; gap: 6px; margin-bottom: 20px; background: var(--bg-card); padding: 4px; border-radius: 12px; box-shadow: var(--shadow); }
  .tab { flex: 1; padding: 10px; text-align: center; font-size: 13px; color: var(--ink-soft); border-radius: 8px; cursor: pointer; font-weight: 600; }
  .tab.active { background: var(--ink); color: var(--bg); }

  .card { background: var(--bg-card); border-radius: 16px; padding: 22px 20px; margin-bottom: 16px; box-shadow: var(--shadow); }
  .card-title { font-size: 12px; letter-spacing: 0.2em; color: var(--ink-soft); margin-bottom: 12px; }

  .countdown-card { text-align: center; }
  .days-left { display: flex; align-items: baseline; justify-content: center; gap: 8px; }
  .days-num { font-family: 'JetBrains Mono', monospace; font-size: 56px; font-weight: 700; color: var(--accent); }

  .progress-bar { width: 100%; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin-bottom: 14px; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--sub), var(--accent)); transition: width 0.6s ease; }
  .progress-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; font-size: 11px; text-align: center; }
  .stat-value { font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 600; }

  .input-row { display: flex; gap: 8px; align-items: center; }
  .input-group { flex: 1; display: flex; align-items: center; background: var(--bg); border-radius: 10px; padding: 0 12px; }
  .input-group input { flex: 1; border: none; background: transparent; padding: 12px 0; font-family: 'JetBrains Mono', monospace; font-size: 16px; outline: none; text-align: center; }
  .input-add { background: var(--ink); color: var(--bg); border: none; padding: 12px 18px; border-radius: 10px; font-weight: 600; cursor: pointer; }

  .category-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .category-tag { padding: 6px 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 16px; font-size: 12px; cursor: pointer; }
  .category-tag.active { background: var(--accent); color: white; border-color: var(--accent); }

  .record-item { padding: 16px 0; border-bottom: 1px solid var(--line); }
  .record-main { display: flex; justify-content: space-between; align-items: center; font-size: 13px; margin-bottom: 8px; }
  .record-time { font-family: 'JetBrains Mono', monospace; font-weight: 700; }
  .record-delete { background: none; border: none; color: var(--ink-faint); font-size: 16px; cursor: pointer; }

  .record-reactions { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
  .reaction-chip { background: var(--bg); padding: 6px 10px; border-radius: 10px; font-size: 12px; display: inline-flex; align-items: center; gap: 6px; }
  .reaction-chip img { width: 80px; height: 80px; object-fit: cover; border-radius: 6px; }
  .reaction-emoji { font-size: 16px; }

  .action-card { background: var(--bg-card); border-radius: 16px; padding: 18px; margin-bottom: 16px; box-shadow: var(--shadow); border: 1px solid var(--line); }
  .action-header { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 12px; }
  .reaction-buttons { display: flex; gap: 8px; margin-bottom: 12px; }
  .react-btn { background: var(--bg); border: 1px solid var(--line); padding: 8px 12px; border-radius: 12px; cursor: pointer; font-size: 16px; }
  
  .msg-input-area { background: var(--bg); padding: 12px; border-radius: 12px; margin-top: 10px; }
  .msg-input { width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 8px; font-family: inherit; font-size: 13px; outline: none; margin-bottom: 8px; }
  .msg-send-btn { width: 100%; background: var(--accent); color: white; border: none; padding: 10px; border-radius: 8px; font-weight: 700; cursor: pointer; }
  .photo-preview { margin-top: 10px; width: 100%; max-width: 150px; border-radius: 8px; display: block; }

  .partner-card { background: linear-gradient(135deg, #fff5f3, #fef0ec); border-radius: 14px; padding: 14px 18px; margin-bottom: 16px; }
  .partner-title { font-size: 11px; color: var(--accent); margin-bottom: 4px; font-weight: 700; }

  .hidden { display: none !important; }
  .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--ink); color: var(--bg); padding: 12px 24px; border-radius: 30px; font-size: 13px; font-weight: 600; box-shadow: 0 8px 20px rgba(0,0,0,0.2); transition: 0.3s; z-index: 9999; }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="mode-screen" class="container">
  <div class="mode-select">
    <div class="mode-brand">宅建 <span class="num">600</span></div>
    <button class="mode-btn rakkyo" onclick="setRole('rakkyo')">らっきょ（勉強側）</button>
    <button class="mode-btn saki" onclick="setRole('saki')">さきちゃん（応援側）</button>
  </div>
</div>

<div id="rakkyo-screen" class="container hidden">
  <header>
    <button class="switch-btn" onclick="switchRole()">切替</button>
    <span class="role-badge">らっきょ</span>
    <div class="brand">宅建 <span class="num">600</span></div>
  </header>
  <div class="tabs">
    <div class="tab active" onclick="showTab('rakkyo', 'study', this)">勉強記録</div>
    <div class="tab" onclick="showTab('rakkyo', 'saki', this)">さきちゃんルーム</div>
  </div>
  <div id="rakkyo-tab-study">
    <div class="partner-card"><div class="partner-title">SAKI'S TODAY</div><div id="partner-stats-rakkyo">—</div></div>
    <div class="card countdown-card">
      <div class="days-left"><span class="days-num" id="days-num">—</span><span style="font-size:16px;color:var(--ink-soft)">日</span></div>
      <div style="font-size:12px;color:var(--ink-faint)">2026年10月14日 試験日まで</div>
    </div>
    <div class="card">
      <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
      <div class="progress-stats">
        <div class="stat"><div>合計</div><div id="total-hours" class="stat-value">—</div></div>
        <div class="stat"><div>残り</div><div id="remain-hours" class="stat-value" style="color:var(--accent)">—</div></div>
        <div class="stat"><div>今日</div><div id="today-hours" class="stat-value">—</div></div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">勉強した時間を入力</div>
      <div class="input-row">
        <div class="input-group"><input type="number" id="manual-hours" placeholder="0" step="0.1"><span>時間</span></div>
        <button class="input-add" onclick="saveRecord()">記録</button>
      </div>
    </div>
    <div id="records-list"></div>
  </div>
  <div id="rakkyo-tab-saki" class="hidden">
    <div id="saki-activity-for-rakkyo"></div>
  </div>
</div>

<div id="saki-screen" class="container hidden">
  <header>
    <button class="switch-btn" onclick="switchRole()">切替</button>
    <span class="role-badge saki">さきちゃん</span>
    <div class="brand">さきちゃんの場所</div>
  </header>
  <div class="tabs">
    <div class="tab active" onclick="showTab('saki', 'self', this)">自分の活動</div>
    <div class="tab" onclick="showTab('saki', 'watch', this)">らっきょ監視</div>
  </div>
  <div id="saki-tab-self">
    <div class="card">
      <div class="category-tags" id="category-tags"></div>
      <div class="input-row">
        <div class="input-group"><input type="number" id="saki-hours" placeholder="0" step="0.1"><span>時間</span></div>
        <button class="input-add" onclick="saveSakiActivity()">追加</button>
      </div>
    </div>
    <div id="saki-my-records"></div>
  </div>
  <div id="saki-tab-watch" class="hidden">
    <div id="rakkyo-records-for-saki"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
  const SUPABASE_URL = 'https://tsromnwejzanfboeminq.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRzcm9tbndlanphbmZib2VtaW5xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzMzc4MDcsImV4cCI6MjA5NDkxMzgwN30.GKaO7VUj4Rd5vxQ-FvSFjO8QmxuBUyKAdeohm3c1lps';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const EXAM_DATE = new Date(2026, 9, 14);
  const TARGET_HOURS = 600;
  const CAT_EMOJIS = { '読書':'📖', '勉強':'📚', '運動':'🏃', '仕事':'💼', '創作':'🎨' };

  let records = [], reactions = [], activities = [], currentRole = null, selectedCat = '読書', pendingPhoto = {};

  const getTodayStr = () => {
    const n = new Date();
    return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;
  };

  const getDaysLeft = () => {
    const t = new Date(); t.setHours(0,0,0,0);
    return Math.ceil((EXAM_DATE - t) / (1000*60*60*24));
  };

  async function fetchAll() {
    const [r1, r2, r3] = await Promise.all([
      sb.from('records').select('*').order('created_at', { ascending: false }),
      sb.from('reactions').select('*').order('created_at', { ascending: false }),
      sb.from('activities').select('*').order('created_at', { ascending: false })
    ]);
    records = r1.data || [];
    reactions = r2.data || [];
    activities = r3.data || [];
    updateUI();
  }

  function setRole(role) {
    currentRole = role;
    localStorage.setItem('takken_role', role);
    document.getElementById('mode-screen').classList.add('hidden');
    document.getElementById(role + '-screen').classList.remove('hidden');
    if(role === 'saki') renderCategoryTags();
    fetchAll();
  }

  function switchRole() { if(confirm('切替えますか？')) { localStorage.removeItem('takken_role'); location.reload(); } }

  function showTab(role, tab, el) {
    const root = document.getElementById(role + '-screen');
    root.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    root.querySelectorAll('[id*="-tab-"]').forEach(d => d.classList.add('hidden'));
    document.getElementById(`${role}-tab-${tab}`).classList.remove('hidden');
  }

  function updateUI() {
    const today = getTodayStr();
    const total = records.reduce((s, r) => s + parseFloat(r.hours), 0);
    const rakkyoToday = records.filter(r => r.date === today).reduce((s, r) => s + parseFloat(r.hours), 0);
    const sakiToday = activities.filter(a => a.date === today).reduce((s, a) => s + parseFloat(a.hours), 0);
    
    if (currentRole === 'rakkyo') {
      document.getElementById('days-num').textContent = getDaysLeft();
      document.getElementById('total-hours').textContent = total.toFixed(1) + 'h';
      document.getElementById('remain-hours').textContent = Math.max(0, TARGET_HOURS - total).toFixed(1) + 'h';
      document.getElementById('today-hours').textContent = rakkyoToday.toFixed(1) + 'h';
      document.getElementById('progress-fill').style.width = Math.min(100, (total/TARGET_HOURS)*100) + '%';
      document.getElementById('partner-stats-rakkyo').textContent = `今日 ${sakiToday.toFixed(1)}h の活動をしています`;
      renderRakkyoStudyTab();
      renderSakiRoomForRakkyo();
    } else {
      renderSakiSelfTab();
      renderSakiWatchTab();
    }
  }

  // --- Rakkyo ---
  async function saveRecord() {
    const h = parseFloat(document.getElementById('manual-hours').value);
    if (!h) return;
    await sb.from('records').insert([{ date: getTodayStr(), hours: h }]);
    document.getElementById('manual-hours').value = '';
    showToast('記録しました！');
    fetchAll();
  }

  function renderRakkyoStudyTab() {
    const list = document.getElementById('records-list');
    list.innerHTML = records.slice(0, 10).map(r => `
      <div class="record-item">
        <div class="record-main">
          <span>${r.date.slice(5)} 勉強記録</span>
          <span class="record-time">${parseFloat(r.hours).toFixed(1)}h</span>
          <button class="record-delete" onclick="deleteItem('records','${r.id}')">×</button>
        </div>
        ${renderReactionList(r.id)}
      </div>
    `).join('');
  }

  function renderSakiRoomForRakkyo() {
    const area = document.getElementById('saki-activity-for-rakkyo');
    area.innerHTML = `<div class="card-title">さきちゃんの最近の活動</div>` + activities.slice(0, 10).map(a => `
      <div class="action-card">
        <div class="action-header"><span>${a.date.slice(5)}</span><strong>${CAT_EMOJIS[a.category]||''} ${a.category} / ${parseFloat(a.hours).toFixed(1)}h</strong></div>
        <div class="reaction-buttons">${['👏','🔥','💪','👀'].map(e => `<button class="react-btn" onclick="addEmoji('${a.id}','${e}')">${e}</button>`).join('')}</div>
        ${renderReactionList(a.id)}
        <div class="msg-input-area">
          <input type="text" id="input-${a.id}" class="msg-input" placeholder="コメントを送る...">
          <div style="display:flex; gap:8px;">
            <label style="flex:1; background:#fff; border:1px solid var(--line); border-radius:8px; padding:10px; font-size:12px; text-align:center; cursor:pointer;">
              📷 写真<input type="file" accept="image/*" style="display:none" onchange="handlePhoto(event, '${a.id}')">
            </label>
            <button class="msg-send-btn" style="flex:2" onclick="sendComment('${a.id}')">送信</button>
          </div>
          <div id="preview-${a.id}"></div>
        </div>
      </div>
    `).join('');
  }

  // --- Saki ---
  function renderCategoryTags() {
    const area = document.getElementById('category-tags');
    area.innerHTML = Object.keys(CAT_EMOJIS).map(c => `<button class="category-tag ${c===selectedCat?'active':''}" onclick="selectedCat='${c}';renderCategoryTags()">${CAT_EMOJIS[c]} ${c}</button>`).join('');
  }

  async function saveSakiActivity() {
    const h = parseFloat(document.getElementById('saki-hours').value);
    if (!h) return;
    await sb.from('activities').insert([{ who: 'saki', category: selectedCat, date: getTodayStr(), hours: h }]);
    document.getElementById('saki-hours').value = '';
    showToast('記録しました！');
    fetchAll();
  }

  function renderSakiSelfTab() {
    const list = document.getElementById('saki-my-records');
    list.innerHTML = activities.slice(0, 10).map(a => `
      <div class="action-card">
        <div class="action-header"><span>${a.date.slice(5)}</span><strong>${CAT_EMOJIS[a.category]||''} ${a.category} / ${parseFloat(a.hours).toFixed(1)}h</strong></div>
        ${renderReactionList(a.id)}
        <div style="text-align:right"><button class="record-delete" onclick="deleteItem('activities','${a.id}')">記録を消す</button></div>
      </div>
    `).join('');
  }

  function renderSakiWatchTab() {
    const area = document.getElementById('rakkyo-records-for-saki');
    area.innerHTML = `<div class="card-title">らっきょの勉強記録</div>` + records.slice(0, 10).map(r => `
      <div class="action-card">
        <div class="action-header"><span>${r.date.slice(5)}</span><strong>勉強記録 / ${parseFloat(r.hours).toFixed(1)}h</strong></div>
        <div class="reaction-buttons">${['👏','💪','📖','🔥'].map(e => `<button class="react-btn" onclick="addEmoji('${r.id}','${e}')">${e}</button>`).join('')}</div>
        ${renderReactionList(r.id)}
        <div class="msg-input-area">
          <input type="text" id="input-${r.id}" class="msg-input" placeholder="応援コメント...">
          <div style="display:flex; gap:8px;">
            <label style="flex:1; background:#fff; border:1px solid var(--line); border-radius:8px; padding:10px; font-size:12px; text-align:center; cursor:pointer;">
              📷 写真<input type="file" accept="image/*" style="display:none" onchange="handlePhoto(event, '${r.id}')">
            </label>
            <button class="msg-send-btn" style="flex:2" onclick="sendComment('${r.id}')">送信</button>
          </div>
          <div id="preview-${r.id}"></div>
        </div>
      </div>
    `).join('');
  }

  // --- Interaction ---
  async function handlePhoto(e, tid) {
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      pendingPhoto[tid] = ev.target.result;
      document.getElementById(`preview-${tid}`).innerHTML = `<img src="${ev.target.result}" class="photo-preview">`;
    };
    reader.readAsDataURL(file);
  }

  async function addEmoji(tid, emoji) {
    await sb.from('reactions').insert([{ record_id: tid, emoji: emoji }]);
    showToast(emoji); fetchAll();
  }

  async function sendComment(tid) {
    const val = document.getElementById(`input-${tid}`).value;
    const photo = pendingPhoto[tid];
    if(!val && !photo) return;
    await sb.from('reactions').insert([{ record_id: tid, message: val, photo_data: photo }]);
    document.getElementById(`input-${tid}`).value = '';
    document.getElementById(`preview-${tid}`).innerHTML = '';
    delete pendingPhoto[tid];
    showToast('送信しました！'); fetchAll();
  }

  function renderReactionList(tid) {
    const filtered = reactions.filter(re => re.record_id === tid);
    if(!filtered.length) return '';
    return `<div class="record-reactions">${filtered.map(re => `
      <span class="reaction-chip">
        ${re.emoji ? `<span class="reaction-emoji">${re.emoji}</span>` : '💬'}
        ${re.message ? `<span>${re.message}</span>` : ''}
        ${re.photo_data ? `<img src="${re.photo_data}" onclick="window.open(this.src)">` : ''}
      </span>`).join('')}</div>`;
  }

  async function deleteItem(table, id) { if(confirm('削除しますか？')) { await sb.from(table).delete().eq('id', id); fetchAll(); } }

  function showToast(m) {
    const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }

  const savedRole = localStorage.getItem('takken_role');
  if (savedRole) setRole(savedRole);
</script>
</body>
</html>
